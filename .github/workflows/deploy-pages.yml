# Prerequisite (one-time, repo admin only, not fixable from this file):
# GitHub Pages must be enabled with Source = "GitHub Actions" under
# Settings -> Pages -> Build and deployment. Until that's done, the
# "Configure GitHub Pages" step below fails immediately (the Pages API
# 404s for a repo with Pages never enabled) regardless of anything else
# in this workflow -- confirmed by comparing failing runs across commits,
# all the way back to before the app/frontend restructuring; every run
# succeeds through "Prepare GitHub Pages site" and only fails there.
name: Deploy website and ELASTIQ demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build ELASTIQ frontend
        working-directory: app/frontend
        # No pricing API is deployed alongside this static site, so
        # VITE_PRICING_API_BASE_URL is intentionally left unset here --
        # lib/api.js only defaults to a localhost URL in dev mode
        # (`npm run dev`), never in a production build, so this ships
        # with no live-data backend configured rather than a dead
        # localhost reference. To point a future deploy of this site at
        # a real, reachable HTTPS pricing API, set the repository
        # variable PRICING_API_BASE_URL (Settings -> Secrets and
        # variables -> Actions -> Variables) -- no workflow edit needed.
        env:
          VITE_PRICING_API_BASE_URL: ${{ vars.PRICING_API_BASE_URL }}
        run: npm run build

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site/demo
          cp index.html site/index.html
          cp -r app/frontend/dist/. site/demo/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4