[pytest]
# Standalone test config for this service -- deliberately not shared with
# the monorepo's root pytest.ini. `pythonpath = .` makes `app` importable
# regardless of the directory pytest is invoked from.
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra
